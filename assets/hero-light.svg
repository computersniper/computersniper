<svg xmlns="http://www.w3.org/2000/svg" width="840" height="272" viewBox="0 0 840 272" fill="none">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; }
      @keyframes pulseLed { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes bobA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      @keyframes bobB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      .led { animation: pulseLed 2.2s ease-in-out infinite; }
      .b1 { animation: bobA 3.0s ease-in-out infinite; }
      .b2 { animation: bobB 3.4s ease-in-out 0.5s infinite; }
      .b3 { animation: bobA 3.2s ease-in-out 1.0s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .led, .b1, .b2, .b3 { animation: none !important; }
      }
    </style>
    <pattern id="archGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(20, 23, 31, 0.045)" stroke-width="1"/>
    </pattern>
    <linearGradient id="jcBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5F88E0"/>
      <stop offset="100%" stop-color="#01143E"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#5F88E0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5F88E0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="heroClip">
      <rect x="1" y="1" width="838" height="270" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
