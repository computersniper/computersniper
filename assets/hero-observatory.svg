<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 244" width="100%" height="244" role="img" aria-label="Jiechao Cai — Open Research &amp; Systems Observatory">
  <defs>
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="prismWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="folioDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.6"/>
    </pattern>
    <clipPath id="obsClip">
      <rect x="4" y="4" width="912" height="236" rx="10"/>
    </clipPath>
  </defs>

  <!-- Archival Midnight Folio Frame -->
  <rect x="2" y="2" width="916" height="240" rx="11" fill="url(#obsBg)" stroke="#020617" stroke-width="3"/>
  <g clip-path="url(#obsClip)">
    <rect x="4" y="4" width="912" height="236" fill="url(#folioDots)"/>
    <circle cx="745" cy="122" r="145" fill="#d4a853" opacity="0.05"/>
    <circle cx="200" cy="190" r="160" fill="#0d9488" opacity="0.06"/>
  </g>
  <rect x="6" y="6" width="908" height="232" rx="8" fill="none" stroke="url(#goldRule)" stroke-width="1.4" stroke-opacity="0.8"/>
  <rect x="11" y="11" width="898" height="222" rx="5" fill="none" stroke="#d4a853" stroke-width="0.5" stroke-opacity="0.35"/>

  <!-- Left Scholarly & Editorial Column -->
  <g transform="translate(38, 36)">
    <text x="0" y="14" fill="#d4a853" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="2">THE UNIVERSITY OF HONG KONG · COMPUTER SCIENCE · OBSERVATORY</text>

    <text x="0" y="58" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" letter-spacing="0.5">Jiechao Cai</text>
    <text x="235" y="56" fill="#e2c078" font-family="'PingFang SC', 'Songti SC', 'Microsoft YaHei', serif" font-size="22" font-weight="600" letter-spacing="2">· 蔡杰超</text>

    <text x="0" y="86" fill="#5eead4" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.4">MSc in Computer Science @ HKU  ·  AI Researcher &amp; Open-Source Builder</text>

    <!-- Illuminated Epigraph -->
    <line x1="2" y1="102" x2="2" y2="140" stroke="#d4a853" stroke-width="2.5"/>
    <text x="14" y="116" fill="#cbd5e1" font-family="Georgia, serif" font-style="italic" font-size="13.5">"Like a gloss written in the margins, and a lens into the black box —</text>
    <text x="14" y="136" fill="#cbd5e1" font-family="Georgia, serif" font-style="italic" font-size="13.5">turning frontier LLM &amp; agent research into transparent, local-first instruments."</text>

    <!-- Focus Badges -->
    <g transform="translate(0, 156)">
      <rect x="0" y="0" width="132" height="24" rx="4" fill="#172033" stroke="#d4a853" stroke-width="0.9"/>
      <text x="66" y="15.5" text-anchor="middle" fill="#fde68a" font-family="'Consolas', monospace" font-size="10" font-weight="bold">LLMs &amp; NLP</text>

      <rect x="140" y="0" width="154" height="24" rx="4" fill="#172033" stroke="#2dd4bf" stroke-width="0.9"/>
      <text x="217" y="15.5" text-anchor="middle" fill="#99f6e4" font-family="'Consolas', monospace" font-size="10" font-weight="bold">Multi-Agent Systems</text>

      <rect x="302" y="0" width="176" height="24" rx="4" fill="#172033" stroke="#38bdf8" stroke-width="0.9"/>
      <text x="390" y="15.5" text-anchor="middle" fill="#bae6fd" font-family="'Consolas', monospace" font-size="10" font-weight="bold">3D Interpretability</text>
    </g>
  </g>

  <!-- Right Animated Astrolabe + Prism Dispersion Illustration -->
  <g transform="translate(742, 122)">
    <!-- Outer Rotating Manifold Ring -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#d4a853" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
    </circle>
    <!-- Middle Counter-Rotating Ring -->
    <circle cx="0" cy="0" r="66" fill="none" stroke="#2dd4bf" stroke-width="0.9" stroke-dasharray="3 5" stroke-opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="0" cy="0" rx="82" ry="30" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" transform="rotate(-24)"/>

    <!-- Incoming Inquiry Beam -->
    <line x1="-112" y1="16" x2="-16" y2="2" stroke="url(#prismWhite)" stroke-width="3"/>

    <!-- Dispersed Spectral Rays (BlackBox + Gloss Motif) -->
    <line x1="14" y1="-6" x2="96" y2="-42" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="16" y1="0" x2="100" y2="-14" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="16" y1="6" x2="100" y2="16" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="14" y1="12" x2="94" y2="44" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.9"/>

    <!-- Labels on Dispersed Rays -->
    <text x="102" y="-39" fill="#fde68a" font-family="'Consolas', monospace" font-size="9" font-weight="bold">Gloss</text>
    <text x="105" y="-11" fill="#5eead4" font-family="'Consolas', monospace" font-size="9" font-weight="bold">Weights</text>
    <text x="105" y="19" fill="#7dd3fc" font-family="'Consolas', monospace" font-size="9" font-weight="bold">Agents</text>
    <text x="100" y="47" fill="#c4b5fd" font-family="'Consolas', monospace" font-size="9" font-weight="bold">XR/HCI</text>

    <!-- Central Glass Prism -->
    <polygon points="0,-30 28,22 -28,22" fill="#0f172a" fill-opacity="0.85" stroke="#fde68a" stroke-width="1.8">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="4" r="3" fill="#fde68a"/>
  </g>
</svg>
