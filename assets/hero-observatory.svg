<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 248" width="100%" height="248" role="img" aria-label="Cai Jiechao — AI Agent, Multimodal World Models, and Reasoning Researcher">
  <defs>
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="prismWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="folioDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.6"/>
    </pattern>
    <clipPath id="obsClip">
      <rect x="4" y="4" width="912" height="240" rx="10"/>
    </clipPath>
  </defs>

  <!-- Archival Midnight Frame -->
  <rect x="2" y="2" width="916" height="244" rx="11" fill="url(#obsBg)" stroke="#020617" stroke-width="3"/>
  <g clip-path="url(#obsClip)">
    <rect x="4" y="4" width="912" height="240" fill="url(#folioDots)"/>
    <circle cx="710" cy="124" r="150" fill="#d4a853" opacity="0.05"/>
    <circle cx="190" cy="190" r="160" fill="#0d9488" opacity="0.06"/>
  </g>
  <rect x="6" y="6" width="908" height="236" rx="8" fill="none" stroke="url(#goldRule)" stroke-width="1.4" stroke-opacity="0.82"/>
  <rect x="11" y="11" width="898" height="226" rx="5" fill="none" stroke="#d4a853" stroke-width="0.5" stroke-opacity="0.35"/>

  <!-- Left Identity Column -->
  <g transform="translate(36, 34)">
    <text x="0" y="14" fill="#d4a853" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="1.8">THE UNIVERSITY OF HONG KONG · MSc IN COMPUTER SCIENCE</text>

    <text x="0" y="58" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" letter-spacing="0.5">Cai Jiechao</text>
    <text x="242" y="56" fill="#e2c078" font-family="'PingFang SC', 'Songti SC', 'Microsoft YaHei', serif" font-size="22" font-weight="600" letter-spacing="2">· 蔡杰超</text>

    <text x="0" y="86" fill="#5eead4" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.3">Affective AI &amp; World-Model Researcher  ·  Agentic Systems Architect</text>

    <line x1="2" y1="102" x2="2" y2="142" stroke="#d4a853" stroke-width="2.5"/>
    <text x="14" y="117" fill="#cbd5e1" font-family="Georgia, serif" font-style="italic" font-size="13">"Building human-centric world models, multimodal memory agents,</text>
    <text x="14" y="137" fill="#cbd5e1" font-family="Georgia, serif" font-style="italic" font-size="13">and deterministic harnesses that turn frontier LLMs into real-world craft."</text>

    <g transform="translate(0, 158)">
      <rect x="0" y="0" width="116" height="24" rx="4" fill="#172033" stroke="#d4a853" stroke-width="0.9"/>
      <text x="58" y="15.5" text-anchor="middle" fill="#fde68a" font-family="'Consolas', monospace" font-size="10" font-weight="bold">AI Agent 95</text>

      <rect x="124" y="0" width="132" height="24" rx="4" fill="#172033" stroke="#2dd4bf" stroke-width="0.9"/>
      <text x="190" y="15.5" text-anchor="middle" fill="#99f6e4" font-family="'Consolas', monospace" font-size="10" font-weight="bold">Multimodal 92</text>

      <rect x="264" y="0" width="132" height="24" rx="4" fill="#172033" stroke="#38bdf8" stroke-width="0.9"/>
      <text x="330" y="15.5" text-anchor="middle" fill="#bae6fd" font-family="'Consolas', monospace" font-size="10" font-weight="bold">Full-Stack 94</text>

      <rect x="404" y="0" width="120" height="24" rx="4" fill="#172033" stroke="#a78bfa" stroke-width="0.9"/>
      <text x="464" y="15.5" text-anchor="middle" fill="#ddd6fe" font-family="'Consolas', monospace" font-size="10" font-weight="bold">Research 90</text>
    </g>
  </g>

  <!-- Right Prism Dispersion into Core Strengths (Shifted left to cx=684 so labels have generous room!) -->
  <g transform="translate(684, 124)">
    <!-- Rotating Orbital Rings -->
    <circle cx="0" cy="0" r="84" fill="none" stroke="#d4a853" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#2dd4bf" stroke-width="0.9" stroke-dasharray="3 5" stroke-opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="0" cy="0" rx="78" ry="28" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.28" transform="rotate(-22)"/>

    <!-- Incoming Core Beam -->
    <line x1="-102" y1="14" x2="-16" y2="2" stroke="url(#prismWhite)" stroke-width="3"/>

    <!-- 5 Dispersed Highlight Rays (Agent / Multimodal / Reasoning / World Models / RSI & RL) -->
    <line x1="12" y1="-10" x2="86" y2="-62" stroke="#fbbf24" stroke-width="2.1" stroke-opacity="0.95"/>
    <line x1="15" y1="-4" x2="90" y2="-31" stroke="#2dd4bf" stroke-width="2.1" stroke-opacity="0.95"/>
    <line x1="16" y1="2" x2="92" y2="0" stroke="#38bdf8" stroke-width="2.1" stroke-opacity="0.95"/>
    <line x1="15" y1="8" x2="90" y2="31" stroke="#a78bfa" stroke-width="2.1" stroke-opacity="0.95"/>
    <line x1="12" y1="14" x2="86" y2="62" stroke="#f472b6" stroke-width="2.1" stroke-opacity="0.95"/>

    <!-- Glowing Endpoint Nodes + Strength Pill Labels (max x = 216 -> 684+216 = 900 < 912!) -->
    <circle cx="86" cy="-62" r="3" fill="#fbbf24"/>
    <text x="94" y="-58" fill="#fde68a" font-family="'Consolas', monospace" font-size="10.5" font-weight="bold">AI Agent &amp; Harness</text>

    <circle cx="90" cy="-31" r="3" fill="#2dd4bf"/>
    <text x="98" y="-27" fill="#5eead4" font-family="'Consolas', monospace" font-size="10.5" font-weight="bold">Multimodal &amp; Video</text>

    <circle cx="92" cy="0" r="3" fill="#38bdf8"/>
    <text x="100" y="4" fill="#7dd3fc" font-family="'Consolas', monospace" font-size="10.5" font-weight="bold">Model Reasoning</text>

    <circle cx="90" cy="31" r="3" fill="#a78bfa"/>
    <text x="98" y="35" fill="#ddd6fe" font-family="'Consolas', monospace" font-size="10.5" font-weight="bold">World Models</text>

    <circle cx="86" cy="62" r="3" fill="#f472b6"/>
    <text x="94" y="66" fill="#fbcfe8" font-family="'Consolas', monospace" font-size="10.5" font-weight="bold">RSI &amp; Post-Train</text>

    <!-- Central Crystal Prism -->
    <polygon points="0,-28 26,20 -26,20" fill="#0f172a" fill-opacity="0.88" stroke="#fde68a" stroke-width="1.8">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="3" r="3" fill="#fde68a"/>
  </g>
</svg>
